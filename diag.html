<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewport diagnostic</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-snap-type:y mandatory}
  body{font-family:-apple-system,system-ui,sans-serif;background:#111;color:#fff}

  /* PAGE 1 — the invitation's exact page rule */
  .p1{
    min-height:calc(100vh + env(safe-area-inset-bottom));
    scroll-snap-align:start;
    background:#0a5c2a;                       /* GREEN = page 1 */
    padding:10px 10px 0;
  }
  .p2{
    min-height:100vh;
    scroll-snap-align:start;
    background:#c1121f;                       /* RED = page 2 */
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:800;
  }

  /* verdict banner — pinned, so it is in the shot wherever you are */
  .verdict{
    position:fixed;left:0;right:0;top:0;z-index:9;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    font-size:19px;font-weight:800;text-align:center;line-height:1.3;
  }
  .ok{background:#0a5c2a;color:#fff}
  .bad{background:#c1121f;color:#fff}

  .note{margin-top:calc(env(safe-area-inset-top) + 74px);
        font-size:15px;font-weight:700;text-align:center;
        background:#000;padding:8px;border-radius:6px}
  table{border-collapse:collapse;font-size:13px;width:100%;
        background:rgba(0,0,0,.5);margin-top:10px;border-radius:6px;overflow:hidden}
  td{padding:4px 7px;border-bottom:1px solid rgba(255,255,255,.14)}
  td:first-child{color:#9fe3b5}
  td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .ua{font-size:10px;color:#bbb;word-break:break-all;padding:6px 2px}
</style>
</head>
<body>

<div class="verdict" id="verdict">measuring…</div>

<section class="p1">
  <div class="note">DO NOT SCROLL — just screenshot this screen</div>
  <table id="t"></table>
  <div class="ua" id="ua"></div>
</section>

<section class="p2">PAGE&nbsp;2</section>

<script>
  const px = v => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;height:' + v;
    document.body.append(d);
    const h = d.getBoundingClientRect().height;
    d.remove();
    return Math.round(h);
  };

  function render () {
    const vv  = window.visualViewport;
    const p1  = document.querySelector('.p1').getBoundingClientRect();
    const p2  = document.querySelector('.p2').getBoundingClientRect();
    /* how much of the red block is on screen right now */
    const redOnScreen = Math.max(0, Math.round(Math.min(innerHeight, p2.bottom) - Math.max(0, p2.top)));
    const v = document.getElementById('verdict');
    if (window.scrollY > 2) {
      v.className = 'verdict bad';
      v.textContent = 'You scrolled (' + Math.round(window.scrollY) + 'px) — scroll back to the top first';
    } else if (redOnScreen > 0) {
      v.className = 'verdict bad';
      v.textContent = 'RED IS SHOWING: ' + redOnScreen + 'px';
    } else {
      v.className = 'verdict ok';
      v.textContent = 'NO RED — page 1 fills the screen';
    }

    const rows = [
      ['red showing (px)',        redOnScreen],
      ['scrollY',                 Math.round(window.scrollY)],
      ['page-1 box height',       Math.round(p1.height)],
      ['window.innerHeight',      window.innerHeight],
      ['visualViewport.height',   vv ? Math.round(vv.height) : 'n/a'],
      ['documentElement.clientH', document.documentElement.clientHeight],
      ['screen.height',           screen.height],
      ['100vh',                   px('100vh')],
      ['100svh',                  px('100svh')],
      ['100lvh',                  px('100lvh')],
      ['100dvh',                  px('100dvh')],
      ['safe-area-inset-top',     px('env(safe-area-inset-top)')],
      ['safe-area-inset-bottom',  px('env(safe-area-inset-bottom)')],
      ['100vh + inset',           px('calc(100vh + env(safe-area-inset-bottom))')],
    ];
    document.getElementById('t').innerHTML =
      rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
    document.getElementById('ua').textContent = navigator.userAgent;
  }

  render();
  addEventListener('resize', render);
  addEventListener('scroll', render, {passive:true});
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', render);
    visualViewport.addEventListener('scroll', render);
  }
</script>
</body>
</html>
